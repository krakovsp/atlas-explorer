<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналіз атласів</title>
    
    <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden; /* Оставляем прокрутку только внутри таблиц */
            background-color: #1a1a1a;
            color: white;
        }

        /* Новый Хедер */
        .site-header {
            background-color: #000;
            padding: 10px 20px;
            border-bottom: 1px solid #333;
        }
        .site-header h1 {
            margin: 0;
            font-size: 24px;
            color: #0078d4;
        }

        /* Контейнер для текста введения */
        .intro-section {
            padding: 15px 20px;
            background-color: #222;
            border-bottom: 1px solid #333;
            font-size: 14px;
            line-height: 1.5;
            color: #ccc;
        }

        .nav-tabs {
            display: flex; background: #1a1a1a; height: 50px;
            align-items: center; padding: 0 20px; gap: 10px;
            border-bottom: 2px solid #333;
        }

        .tab-button {
            padding: 8px 20px; cursor: pointer; background: #333;
            color: white; border: none; border-radius: 4px 4px 0 0;
        }

        .tab-button.active { background: #0078d4; font-weight: bold; }

        /* Динамический расчет высоты: 100vh минус хедер, интро и навигация */
        .tab-content { 
            height: calc(100vh - 180px); /* Подберите это значение под высоту вашего текста */
            display: none; 
        }
        .tab-content.active { display: block; }
        .table-container { height: 100%; width: 100%; }

        .tabulator-tooltip {
            background-color: #2c3e50 !important;
            color: #ecf0f1 !important;
            border-radius: 4px !important;
            padding: 10px !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        /* Добавляет тень для закрепленной колонки, чтобы отделить её от прокручиваемой части */
        .tabulator-cell.tabulator-frozen {
           border-right: 2px solid #333 !important;
           box-shadow: 5px 0 5px -5px rgba(0,0,0,0.5);
        }
        /* Цвет для зеленой галочки */
        .tabulator-cell span[aria-label="true"] {
           color: #27ae60 !important;
           font-weight: bold;
           font-size: 1.2em;
        }

        /* Цвет для красного крестика */
         .tabulator-cell span[aria-label="false"] {
           color: #e74c3c !important;
           font-weight: bold;
           font-size: 1.2em;
        }
        .tabulator-col-group {
           background-color: #2c3e50 !important;
           border-bottom: 1px solid #444 !important;
        }
        /* Стилизация полей ввода фильтров в шапке */
.tabulator-header-filter input {
    background: #333 !important;
    color: #fff !important;
    border: 1px solid #555 !important;
    border-radius: 3px;
    padding: 4px !important;
    box-sizing: border-box;
}

/* Стилизация выпадающего списка (select) */
.tabulator-header-filter select {
    background: #333 !important;
    color: #fff !important;
}

/* Убираем лишние отступы, чтобы шапка не стала слишком огромной */
.tabulator-header .tabulator-col .tabulator-col-content .tabulator-header-filter {
    margin-top: 5px;
}
/* Стилизация блока пагинации */
.tabulator-footer {
    background-color: #1a1a1a !important;
    color: white !important;
    border-top: 1px solid #333 !important;
    padding: 10px !important;
}

/* Стилизация кнопок пагинации (1, 2, 3, След...) */
.tabulator-page {
    background: #333 !important;
    color: white !important;
    border: 1px solid #444 !important;
    border-radius: 4px;
    margin: 0 2px;
}

.tabulator-page.active {
    background: #0078d4 !important; /* Цвет активной страницы */
    border-color: #0078d4 !important;
}

/* Стилизация селектора количества строк */
.tabulator-page-size {
    background: #333 !important;
    color: white !important;
    border: 1px solid #444 !important;
}
    </style>
</head>
<body>

<header class="site-header">
    <h1>Аналіз атласів</h1>
</header>

<section class="intro-section">
    <p>Ласкаво просимо! Нижче представлені інтерактивні таблиці для аналізу сучасних картографічних атласів. 
       Ви можете перемикатися між категоріями, сортувати дані та переглядати деталі при наведенні на комірки.</p>
</section>

<nav class="nav-tabs">
    <button class="tab-button active" onclick="openTab(event, 'tab1')">Склад</button>
    <button class="tab-button" onclick="openTab(event, 'tab2')">Города</button>
    <button class="tab-button" onclick="openTab(event, 'tab3')">Задачи</button>
</nav>

<div id="tab1" class="tab-content active">
    <div id="table1-id" class="table-container"></div>
</div>

<div id="tab2" class="tab-content">
    <div id="table2-id" class="table-container"></div>
</div>

<div id="tab3" class="tab-content">
    <div id="table3-id" class="table-container"></div>
</div>

<script>
    function createRemoteTable(id, url, columns) {
        return new Tabulator(id, {
            ajaxURL: "data/" + url,
            layout: "fitColumns",
            columnDefaults: {
            headerHozAlign: "center", // Выравнивание заголовков по центру
            }, 
            placeholder: "Завантаження даних...",
            // Добавляем сопоставление для корректной работы галочек
            dataReceiveParams: {
            "last_page": "last_page", 
            },
                        dataLoaded: function(data) {
            this.refreshFilterValues(); 
            },
            // --- Настройки пагинации ---
            pagination: "local",       // Включаем локальную пагинацию
            paginationSize: 10,        // Количество записей на одной странице
            paginationSizeSelector: [5, 10, 20, 50], // Выбор пользователем кол-ва строк
            paginationCounter: "rows", // Показывает счетчик строк внизу
        // ---------------------------
            columns: columns,
            tooltip: function(e, cell) {
                const data = cell.getData();
                return data["Команда розробників"] ? data["Команда розробників"] : false;
            }
        });
    }

    const table1 = createRemoteTable("#table1-id", "data1.json", [
        {title:"N", field:"id", width:70},
        {title:"Назва", field:"Назва", frozen:true},
        {title:"Дата випуску", field:"Дата випуску", headerTooltip: "Опис для дати випуску..."},
        {
        title:"Англійська", 
        field:"Англійська мова", 
        width:120, 
        hozAlign:"center",
        formatter:"tickCross", 
        formatterParams:{
            trueValue:"Так",  // Что считать галочкой
            falseValue:"Ні", // Что считать крестиком
            crossElement: "✘", // Символ крестика
            tickElement: "✔",  // Символ галочки
        }
    }
    ]);

    const table2 = createRemoteTable("#table2-id", "data2.json", [
        {title:"Тип видавця", field:"Тип видавця", headerTooltip: "шалай балай"},
        {title:"Видавець", field:"Видавець", headerTooltip: "Бур бур ля ля"}
    ]);

    const table3 = createRemoteTable("#table3-id", "data3.json", [
        {title:"Кількість мов", field:"Кількість мов", frozen:true},
        {
            title:"Загальна інформація",
            headerHozAlign: "center",
            columns:[
            {title:"Дата останнього оновлення", field:"Дата останнього оновлення"},
            {title:"Спосіб реалізації", 
            field:"Спосіб реалізації",
            headerFilter: "list", // В новых версиях Tabulator лучше использовать "list" вместо "select"
            headerFilterParams: {
            values: true, // Искать уникальные значения в колонке
            clearable: true // Добавить крестик для сброса фильтра
            }},],
        },
        {
            title:"Інтерфейс",
            headerHozAlign: "center",
            columns:[
            {title:"Мобільні пристрої", field:"Мобільні пристрої"},
            {title:"Дата останнього оновлення", field:"Дата останнього оновлення", headerFilter: "input"},
            {title:"URL", field:"URL"},
            {title:"Мобільні пристрої", field:"Мобільні пристрої"},
            {title:"Дата останнього оновлення", field:"Дата останнього оновлення"},
            {title:"Команда розробників", field:"Команда розробників"},],
        },
        {
            title:"Навігація",
            headerHozAlign: "center",
            columns:[  
            {title:"Дата останнього оновлення", field:"Дата останнього оновлення"},
            {title:"Дата останнього оновлення", field:"Дата останнього оновлення"},
            {title:"URL", field:"URL"},
            {title:"Англійська мова", field:"Англійська мова"},],
        } 

    ]);

    function openTab(evt, tabName) {
        const contents = document.getElementsByClassName("tab-content");
        for (let x of contents) x.style.display = "none";
        
        const buttons = document.getElementsByClassName("tab-button");
        for (let x of buttons) x.classList.remove("active");

        document.getElementById(tabName).style.display = "block";
        evt.currentTarget.classList.add("active");
        
        if (tabName === 'tab1') table1.redraw();
        if (tabName === 'tab2') table2.redraw();
        if (tabName === 'tab3') table3.redraw();
    }
</script>
</body>
</html>
