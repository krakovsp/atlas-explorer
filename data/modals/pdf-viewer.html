<div id="pdf-viewer-modal"
     class="modal-overlay pdf-viewer-modal"
     role="dialog"
     aria-modal="true"
     aria-labelledby="pdf-viewer-title"
     onclick="closePdfViewer()">

    <div class="modal-window pdf-viewer-window"
         onclick="event.stopPropagation()">

        <div class="modal-header pdf-viewer-header">
            <h2 id="pdf-viewer-title">Document preview</h2>

            <div class="pdf-viewer-actions">
                <a id="pdf-viewer-external-link"
                   class="pdf-viewer-external-link"
                   href="#"
                   target="_blank"
                   rel="noopener noreferrer">

                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    <span>Open in new tab</span>
                </a>

                <button type="button"
                        class="modal-close-btn"
                        aria-label="Close document preview"
                        onclick="closePdfViewer()">

                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <div class="pdf-viewer-body">
            <iframe id="pdf-viewer-frame"
                    class="pdf-viewer-frame"
                    title="PDF document preview">
            </iframe>
        </div>

    </div>
</div>
